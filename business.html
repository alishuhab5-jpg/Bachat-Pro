<!-- ==============================
     ADD BUSINESS TRANSACTION
============================== -->

<section class="card">

  <h2>➕ Add Business Transaction</h2>

  <select id="businessType">

    <option value="investment">
      💰 Investment
    </option>

    <option value="sale">
      🛒 Sale
    </option>

    <option value="expense">
      💸 Business Expense
    </option>

  </select>


  <input
    type="number"
    id="businessAmount"
    placeholder="Amount (Rs)"
    min="1"
  >


  <input
    type="date"
    id="businessDate"
  >


  <input
    type="text"
    id="businessNote"
    placeholder="Note e.g. Shop stock"
  >


  <button onclick="saveBusinessTransaction()">
    💾 Save Business Transaction
  </button>

</section>

</main>

<script>

function goHome(){

  window.location.href = "index.html";

}

let businessTransactions =
  JSON.parse(
    localStorage.getItem("bachatBusinessTransactions")
  ) || [];

function saveBusinessTransaction(){

  const type =
    document.getElementById("businessType").value;

  const amount =
    Number(
      document.getElementById("businessAmount").value
    );

  const date =
    document.getElementById("businessDate").value;

  const note =
    document.getElementById("businessNote").value.trim();

  if(amount <= 0){

    alert("Please enter amount.");

    return;

  }

  if(!date){

    alert("Please select date.");

    return;

  }

  businessTransactions.push({

    id: Date.now(),
    type: type,
    amount: amount,
    date: date,
    note: note

  });

  localStorage.setItem(
    "bachatBusinessTransactions",
    JSON.stringify(businessTransactions)
  );

  document.getElementById("businessAmount").value = "";

  document.getElementById("businessNote").value = "";

  alert("✅ Business transaction saved!");

}

</script>

</body>
</html>
