<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#159447">

  <title>Bachat Pro</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>💰 Bachat Pro</h1>
  <p>Daily Expense & Savings</p>
</header>

<main>

  <!-- Balance -->
  <section class="balance-card">
    <p>Total Bachat</p>

    <h2 id="balance">Rs 0</h2>

    <div class="summary">

      <div>
        <span>💰 Income</span>
        <strong id="income">Rs 0</strong>
      </div>

      <div>
        <span>💸 Expense</span>
        <strong id="expense">Rs 0</strong>
      </div>

    </div>
  </section>


  <!-- Add Transaction -->
  <section class="form-card">

    <h2>➕ Add Transaction</h2>

    <!-- Type -->
    <label>Transaction Type</label>

    <select id="type">
      <option value="expense">💸 Expense</option>
      <option value="income">💰 Income</option>
    </select>


    <!-- Amount -->
    <label>Amount</label>

    <input
      type="number"
      id="amount"
      placeholder="Enter amount in Rs"
      min="1"
    >


    <!-- Category -->
    <label>Category</label>

    <select id="category">

      <option value="Grocery">🛒 Grocery</option>

      <option value="Electricity">💡 Electricity</option>

      <option value="Gas">🔥 Gas</option>

      <option value="Petrol">⛽ Petrol</option>

      <option value="Mobile">📱 Mobile / Internet</option>

      <option value="Education">🎓 Education</option>

      <option value="Health">🏥 Health</option>

      <option value="Shopping">🛍️ Shopping</option>

      <option value="Home">🏠 Home</option>

      <option value="Salary">💼 Salary</option>

      <option value="Business">💼 Business</option>

      <option value="Other">📦 Other</option>

    </select>


    <!-- Date -->
    <label>Date</label>

    <input
      type="date"
      id="date"
    >


    <!-- Note -->
    <label>Note</label>

    <input
      type="text"
      id="note"
      placeholder="Optional note"
      maxlength="100"
    >


    <!-- Save -->
    <button onclick="addTransaction()">
      Save Transaction
    </button>

  </section>


  <!-- Transactions -->
  <section class="transactions-card">

    <h2>📋 Recent Transactions</h2>

    <div id="transactions">

      <p class="empty">
        No transactions yet.
      </p>

    </div>

  </section>

</main>


<script>

let transactions =
  JSON.parse(
    localStorage.getItem("bachatTransactions")
  ) || [];


// Set today's date
function setToday() {

  const today =
    new Date().toISOString().split("T")[0];

  document.getElementById("date").value = today;
}


// Save data
function saveData() {

  localStorage.setItem(
    "bachatTransactions",
    JSON.stringify(transactions)
  );
}


// Add transaction
function addTransaction() {

  const type =
    document.getElementById("type").value;

  const amount =
    Number(
      document.getElementById("amount").value
    );

  const category =
    document.getElementById("category").value;

  const date =
    document.getElementById("date").value;

  const note =
    document.getElementById("note").value.trim();


  // Validation
  if (!amount || amount <= 0) {

    alert("Please enter a valid amount.");

    return;
  }


  if (!date) {

    alert("Please select a date.");

    return;
  }


  // Create transaction
  const transaction = {

    id: Date.now(),

    type: type,

    amount: amount,

    category: category,

    date: date,

    note: note

  };


  transactions.push(transaction);


  saveData();


  // Clear form
  document.getElementById("amount").value = "";

  document.getElementById("note").value = "";


  // Update
  updateScreen();
}


// Delete transaction
function deleteTransaction(id) {

  const confirmDelete =
    confirm("Delete this transaction?");

  if (!confirmDelete) {
    return;
  }


  transactions =
    transactions.filter(
      function(transaction) {

        return transaction.id !== id;

      }
    );


  saveData();

  updateScreen();
}


// Format date
function formatDate(dateString) {

  const date =
    new Date(dateString + "T00:00:00");

  return date.toLocaleDateString(
    "en-GB",
    {
      day: "2-digit",
      month: "short",
      year: "numeric"
    }
  );
}


// Update screen
function updateScreen() {

  let income = 0;

  let expense = 0;


  transactions.forEach(
    function(transaction) {

      if (transaction.type === "income") {

        income += transaction.amount;

      } else {

        expense += transaction.amount;

      }

    }
  );


  const balance =
    income - expense;


  // Update totals
  document.getElementById(
    "income"
  ).textContent =
    "Rs " + income.toLocaleString();


  document.getElementById(
    "expense"
  ).textContent =
    "Rs " + expense.toLocaleString();


  document.getElementById(
    "balance"
  ).textContent =
    "Rs " + balance.toLocaleString();


  // Transaction container
  const container =
    document.getElementById(
      "transactions"
    );


  if (transactions.length === 0) {

    container.innerHTML =
      '<p class="empty">No transactions yet.</p>';

    return;
  }


  container.innerHTML = "";


  // Newest first
  const sorted =
    [...transactions].sort(
      function(a, b) {

        return b.id - a.id;

      }
    );


  sorted.forEach(
    function(transaction) {

      const item =
        document.createElement("div");


      item.className =
        "transaction " +
        transaction.type;


      const sign =
        transaction.type === "income"
        ? "+"
        : "-";


      const noteText =
        transaction.note
        ? " • " + transaction.note
        : "";


      item.innerHTML = `

        <div>

          <strong>
            ${escapeHTML(transaction.category)}
          </strong>

          <small>
            ${formatDate(transaction.date)}
            ${noteText}
          </small>

        </div>


        <div>

          <strong>

            ${sign}
            Rs ${transaction.amount.toLocaleString()}

          </strong>


          <button
            class="delete-btn"
            onclick="deleteTransaction(${transaction.id})"
          >
            ×
          </button>

        </div>

      `;


      container.appendChild(item);

    }
  );
}


// Security helper
function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


// Start app
setToday();

updateScreen();

</script>

</body>
</html>
