<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bachat Pro</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>💰 Bachat Pro</h1>
    <p>Daily Expense & Savings</p>
</header>

<main>

    <section class="balance-card">
        <p>Total Balance</p>
        <h2 id="balance">Rs 0</h2>

        <div class="summary">
            <div>
                <span>Income</span>
                <strong id="income">Rs 0</strong>
            </div>

            <div>
                <span>Expense</span>
                <strong id="expense">Rs 0</strong>
            </div>
        </div>
    </section>

    <section class="form-card">

        <h2>Add Transaction</h2>

        <input
            type="text"
            id="description"
            placeholder="Example: Salary / Food"
        >

        <input
            type="number"
            id="amount"
            placeholder="Amount (Rs)"
        >

        <select id="type">
            <option value="income">Income</option>
            <option value="expense">Expense</option>
        </select>

        <button onclick="addTransaction()">
            + Add Transaction
        </button>

    </section>

    <section class="transactions-card">

        <h2>Transactions</h2>

        <div id="transactions">
            <p class="empty">No transactions yet.</p>
        </div>

    </section>

</main>

<script>

let transactions =
    JSON.parse(localStorage.getItem("bachatTransactions")) || [];

function saveData() {
    localStorage.setItem(
        "bachatTransactions",
        JSON.stringify(transactions)
    );
}

function addTransaction() {

    const description =
        document.getElementById("description").value.trim();

    const amount =
        Number(document.getElementById("amount").value);

    const type =
        document.getElementById("type").value;

    if (!description || !amount || amount <= 0) {
        alert("Please enter description and amount.");
        return;
    }

    const transaction = {
        id: Date.now(),
        description: description,
        amount: amount,
        type: type
    };

    transactions.push(transaction);

    saveData();

    document.getElementById("description").value = "";
    document.getElementById("amount").value = "";

    updateScreen();
}

function deleteTransaction(id) {

    transactions =
        transactions.filter(t => t.id !== id);

    saveData();

    updateScreen();
}

function updateScreen() {

    let income = 0;
    let expense = 0;

    transactions.forEach(t => {

        if (t.type === "income") {
            income += t.amount;
        } else {
            expense += t.amount;
        }

    });

    const balance = income - expense;

    document.getElementById("income").textContent =
        "Rs " + income.toLocaleString();

    document.getElementById("expense").textContent =
        "Rs " + expense.toLocaleString();

    document.getElementById("balance").textContent =
        "Rs " + balance.toLocaleString();

    const container =
        document.getElementById("transactions");

    if (transactions.length === 0) {

        container.innerHTML =
            '<p class="empty">No transactions yet.</p>';

        return;
    }

    container.innerHTML = "";

    [...transactions].reverse().forEach(t => {

        const item = document.createElement("div");

        item.className =
            "transaction " + t.type;

        item.innerHTML = `
            <div>
                <strong>${escapeHTML(t.description)}</strong>
                <small>${t.type === "income" ? "Income" : "Expense"}</small>
            </div>

            <div>
                <strong>
                    ${t.type === "income" ? "+" : "-"} Rs ${t.amount.toLocaleString()}
                </strong>

                <button
                    class="delete-btn"
                    onclick="deleteTransaction(${t.id})">
                    ×
                </button>
            </div>
        `;

        container.appendChild(item);

    });
}

function escapeHTML(text) {

    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;

}

updateScreen();

</script>

</body>
</html>
