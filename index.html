<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#159447">
  <title>Bachat Pro</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>💰 Bachat Pro</h1>
  <p>Daily Expense & Savings</p>
</header>

<main>

  <!-- Balance -->
  <section class="balance-card">
    <p>Total Bachat</p>
    <h2 id="balance">Rs 0</h2>

    <div class="summary">
      <div>
        <span>💰 Income</span>
        <strong id="income">Rs 0</strong>
      </div>

      <div>
        <span>💸 Expense</span>
        <strong id="expense">Rs 0</strong>
      </div>
    </div>
  </section>


  <!-- Add / Edit Transaction -->
  <section class="form-card">

    <h2 id="formTitle">➕ Add Transaction</h2>

    <select id="type">
      <option value="expense">💸 Expense</option>
      <option value="income">💰 Income</option>
    </select>

    <input
      type="number"
      id="amount"
      placeholder="Amount (Rs)"
      min="1"
    >

    <select id="category">
      <option value="Grocery">🛒 Grocery</option>
      <option value="Electricity">💡 Electricity</option>
      <option value="Gas">🔥 Gas</option>
      <option value="Petrol">⛽ Petrol</option>
      <option value="Mobile">📱 Mobile / Internet</option>
      <option value="Education">🎓 Education</option>
      <option value="Health">🏥 Health</option>
      <option value="Shopping">🛍️ Shopping</option>
      <option value="Home">🏠 Home</option>
      <option value="Salary">💼 Salary</option>
      <option value="Business">💼 Business</option>
      <option value="Other">📦 Other</option>
    </select>

    <input type="date" id="date">

    <input
      type="text"
      id="note"
      placeholder="Note (optional)"
      maxlength="100"
    >

    <button onclick="saveTransaction()" id="saveButton">
      Save Transaction
    </button>

    <button
      onclick="cancelEdit()"
      id="cancelButton"
      style="display:none; margin-top:10px; background:#777;"
    >
      Cancel Edit
    </button>

  </section>


  <!-- Search & Filter -->
  <section class="form-card">

    <h2>🔍 Find Transactions</h2>

    <input
      type="search"
      id="search"
      placeholder="Search transaction..."
      oninput="updateScreen()"
    >

    <select id="filterCategory" onchange="updateScreen()">

      <option value="all">📂 All Categories</option>

      <option value="Grocery">🛒 Grocery</option>
      <option value="Electricity">💡 Electricity</option>
      <option value="Gas">🔥 Gas</option>
      <option value="Petrol">⛽ Petrol</option>
      <option value="Mobile">📱 Mobile / Internet</option>
      <option value="Education">🎓 Education</option>
      <option value="Health">🏥 Health</option>
      <option value="Shopping">🛍️ Shopping</option>
      <option value="Home">🏠 Home</option>
      <option value="Salary">💼 Salary</option>
      <option value="Business">💼 Business</option>
      <option value="Other">📦 Other</option>

    </select>

  </section>


  <!-- Transactions -->
  <section class="transactions-card">

    <h2>📋 Transactions</h2>

    <div id="transactions">
      <p class="empty">No transactions yet.</p>
    </div>

  </section>

</main>


<script>

let transactions =
  JSON.parse(
    localStorage.getItem("bachatTransactions")
  ) || [];

let editingId = null;


// Today's date
function setToday() {

  const today =
    new Date().toISOString().split("T")[0];

  document.getElementById("date").value = today;
}


// Save data
function saveData() {

  localStorage.setItem(
    "bachatTransactions",
    JSON.stringify(transactions)
  );
}


// Save new transaction OR edited transaction
function saveTransaction() {

  const type =
    document.getElementById("type").value;

  const amount =
    Number(
      document.getElementById("amount").value
    );

  const category =
    document.getElementById("category").value;

  const date =
    document.getElementById("date").value;

  const note =
    document.getElementById("note").value.trim();


  if (!amount || amount <= 0) {

    alert("Please enter a valid amount.");

    return;
  }


  if (!date) {

    alert("Please select a date.");

    return;
  }


  // EDIT MODE
  if (editingId !== null) {

    const transaction =
      transactions.find(
        function(item) {
          return item.id === editingId;
        }
      );


    if (transaction) {

      transaction.type = type;
      transaction.amount = amount;
      transaction.category = category;
      transaction.date = date;
      transaction.note = note;

    }


    editingId = null;

    document.getElementById("formTitle").textContent =
      "➕ Add Transaction";

    document.getElementById("saveButton").textContent =
      "Save Transaction";

    document.getElementById("cancelButton").style.display =
      "none";


  } else {

    // NEW TRANSACTION

    transactions.push({

      id: Date.now(),

      type: type,

      amount: amount,

      category: category,

      date: date,

      note: note

    });

  }


  saveData();

  clearForm();

  updateScreen();
}


// Start editing
function editTransaction(id) {

  const transaction =
    transactions.find(
      function(item) {
        return item.id === id;
      }
    );


  if (!transaction) {
    return;
  }


  editingId = id;


  document.getElementById("type").value =
    transaction.type;

  document.getElementById("amount").value =
    transaction.amount;

  document.getElementById("category").value =
    transaction.category;

  document.getElementById("date").value =
    transaction.date;

  document.getElementById("note").value =
    transaction.note || "";


  document.getElementById("formTitle").textContent =
    "✏️ Edit Transaction";

  document.getElementById("saveButton").textContent =
    "Update Transaction";

  document.getElementById("cancelButton").style.display =
    "block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


// Cancel editing
function cancelEdit() {

  editingId = null;

  document.getElementById("formTitle").textContent =
    "➕ Add Transaction";

  document.getElementById("saveButton").textContent =
    "Save Transaction";

  document.getElementById("cancelButton").style.display =
    "none";

  clearForm();
}


// Clear form
function clearForm() {

  document.getElementById("amount").value = "";

  document.getElementById("note").value = "";

  document.getElementById("type").value =
    "expense";

  document.getElementById("category").value =
    "Grocery";

  setToday();
}


// Delete
function deleteTransaction(id) {

  if (!confirm("Delete this transaction?")) {
    return;
  }


  transactions =
    transactions.filter(
      function(item) {
        return item.id !== id;
      }
    );


  saveData();

  updateScreen();
}


// Format date
function formatDate(dateString) {

  const date =
    new Date(dateString + "T00:00:00");

  return date.toLocaleDateString(
    "en-GB",
    {
      day: "2-digit",
      month: "short",
      year: "numeric"
    }
  );
}


// Update screen
function updateScreen() {

  let income = 0;
  let expense = 0;


  transactions.forEach(
    function(transaction) {

      if (transaction.type === "income") {
        income += transaction.amount;
      } else {
        expense += transaction.amount;
      }

    }
  );


  const balance =
    income - expense;


  document.getElementById("income").textContent =
    "Rs " + income.toLocaleString();

  document.getElementById("expense").textContent =
    "Rs " + expense.toLocaleString();

  document.getElementById("balance").textContent =
    "Rs " + balance.toLocaleString();


  const searchText =
    document.getElementById("search").value
      .toLowerCase()
      .trim();


  const selectedCategory =
    document.getElementById("filterCategory").value;


  const filtered =
    transactions.filter(
      function(transaction) {

        const searchable =
          (
            transaction.category +
            " " +
            (transaction.note || "") +
            " " +
            transaction.type
          ).toLowerCase();


        const matchesSearch =
          searchable.includes(searchText);


        const matchesCategory =
          selectedCategory === "all" ||
          transaction.category === selectedCategory;


        return matchesSearch && matchesCategory;

      }
    );


  const container =
    document.getElementById("transactions");


  if (filtered.length === 0) {

    container.innerHTML =
      '<p class="empty">No matching transactions.</p>';

    return;
  }


  container.innerHTML = "";


  filtered
    .slice()
    .sort(
      function(a, b) {
        return b.id - a.id;
      }
    )
    .forEach(
      function(transaction) {

        const item =
          document.createElement("div");


        item.className =
          "transaction " +
          transaction.type;


        const sign =
          transaction.type === "income"
            ? "+"
            : "-";


        const note =
          transaction.note
            ? " • " + transaction.note
            : "";


        item.innerHTML = `

          <div>

            <strong>
              ${escapeHTML(transaction.category)}
            </strong>

            <small>
              ${formatDate(transaction.date)}
              ${escapeHTML(note)}
            </small>

          </div>


          <div>

            <strong>
              ${sign} Rs ${transaction.amount.toLocaleString()}
            </strong>


            <button
              class="delete-btn"
              onclick="editTransaction(${transaction.id})"
              title="Edit"
              style="
                background:#eaf4ff;
                color:#2878d4;
              "
            >
              ✏️
            </button>


            <button
              class="delete-btn"
              onclick="deleteTransaction(${transaction.id})"
              title="Delete"
            >
              ×
            </button>

          </div>

        `;


        container.appendChild(item);

      }
    );
}


// Security helper
function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


// Start
setToday();

updateScreen();

</script>

</body>
</html>
